[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zjm-rag"
version = "0.4.0"
description = "Find the file that holds the answer: zg finds, Jev ranks, an LLM answers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
zjm = "zjm_rag.cli:main"

[tool.setuptools]
packages = ["zjm_rag"]
