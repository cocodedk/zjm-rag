name: Release

# Manual only: the tag this workflow pushes must never trigger it again.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest vX.Y.Z tag (ignored when HEAD is already tagged)
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Plan the version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          # A retry after the tag was pushed reuses that tag instead of bumping again.
          here=$(git tag --points-at HEAD | grep -E "$semver" | sort -V | tail -1 || true)
          if [ -n "$here" ]; then
            tag=$here
          else
            latest=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -1 || true)
            IFS=. read -r major minor patch <<< "${latest#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "$BUMP" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              *)     patch=$((patch+1)) ;;
            esac
            tag="v$major.$minor.$patch"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists on another commit"; exit 1
            fi
          fi
          state=$(gh release view "$tag" --json isDraft -q 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "release $tag (existing release: $state)"

      - name: Test
        run: python -m unittest discover -s tests -q

      - name: Build wheel and sdist stamped with the tag's version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --quiet build==1.3.0
          python -m build
          ls dist

      - name: Verify the artifacts carry the version
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          wheel=$(ls dist/zjm_rag-"$VERSION"-py3-none-any.whl)
          test -f dist/zjm_rag-"$VERSION".tar.gz
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet "$wheel"
          test "$(/tmp/v/bin/python -c 'import importlib.metadata as m; print(m.version("zjm-rag"))')" = "$VERSION"
          /tmp/v/bin/zjm --help >/dev/null
          (cd dist && zip -q ../zjm-rag.zip "zjm_rag-$VERSION-py3-none-any.whl" "zjm_rag-$VERSION.tar.gz")
          mv zjm-rag.zip dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" HEAD
          fi
          test "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)"
          git push origin "refs/tags/$TAG"

      - name: Draft, upload, verify, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          STATE: ${{ steps.plan.outputs.state }}
        run: |
          set -euo pipefail
          want="zjm-rag.zip zjm_rag-$VERSION-py3-none-any.whl zjm_rag-$VERSION.tar.gz"
          have() { gh release view "$TAG" --json assets -q '.assets[].name' | sort | tr '\n' ' '; }
          expected=$(printf '%s\n' $want | sort | tr '\n' ' ')
          if [ "$STATE" = published ]; then
            [ "$(have)" = "$expected" ] && { echo "$TAG already published and complete"; exit 0; }
            echo "::error::$TAG is published but its assets are incomplete; fix it by hand"; exit 1
          fi
          [ "$STATE" = none ] && gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          (cd dist && gh release upload "$TAG" $want --clobber)
          [ "$(have)" = "$expected" ] || { echo "::error::assets: $(have)"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
